<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Semantic Cache Proxy — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a34;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #5eead4;
    --hit: #34d399;
    --miss: #f97373;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .card .value.accent { color: var(--accent); }
  .row { display: flex; gap: 20px; }
  .col { flex: 1; min-width: 0; }
  .panel-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.hit { background: rgba(52,211,153,0.15); color: var(--hit); }
  .badge.miss { background: rgba(249,115,115,0.15); color: var(--miss); }
  .prompt-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  canvas { max-height: 240px; }
</style>
</head>
<body>
  <h1>Semantic Caching Proxy</h1>
  <div class="subtitle" id="subtitle">connecting to backend…</div>

  <div class="grid">
    <div class="card"><div class="label">Cache hit rate</div><div class="value accent" id="hitRate">—</div></div>
    <div class="card"><div class="label">Est. $ saved</div><div class="value accent" id="costSaved">—</div></div>
    <div class="card"><div class="label">Cached queries</div><div class="value" id="cachedQueries">—</div></div>
    <div class="card"><div class="label">Avg hit latency</div><div class="value" id="hitLatency">—</div></div>
    <div class="card"><div class="label">Avg miss latency</div><div class="value" id="missLatency">—</div></div>
    <div class="card"><div class="label">Similarity threshold</div><div class="value" id="threshold">—</div></div>
  </div>

  <div class="row">
    <div class="col">
      <div class="panel-title">Requests (hit vs miss)</div>
      <canvas id="hitMissChart"></canvas>
    </div>
    <div class="col" style="flex: 1.3;">
      <div class="panel-title">Live request feed</div>
      <table>
        <thead><tr><th>Prompt</th><th>Status</th><th>Similarity</th><th>Latency</th></tr></thead>
        <tbody id="feedBody"></tbody>
      </table>
    </div>
  </div>

<script>
const API_BASE = window.location.origin.includes("5500") || window.location.protocol === "file:"
  ? "http://localhost:8000"
  : "";

let chart;

function initChart() {
  const ctx = document.getElementById('hitMissChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Cache hits', 'Cache misses'],
      datasets: [{ data: [0, 0], backgroundColor: ['#34d399', '#f97373'], borderWidth: 0 }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e6e8ec' } } },
      cutout: '65%'
    }
  });
}

async function refresh() {
  try {
    const [statsRes, recentRes] = await Promise.all([
      fetch(`${API_BASE}/stats`),
      fetch(`${API_BASE}/recent?limit=15`)
    ]);
    const stats = await statsRes.json();
    const recent = await recentRes.json();

    document.getElementById('subtitle').textContent =
      `connected · provider: ${stats.llm_provider} · ${stats.requests_in_window} requests observed`;

    document.getElementById('hitRate').textContent = `${stats.hit_rate_pct}%`;
    document.getElementById('costSaved').textContent = `$${stats.total_cost_saved_usd.toFixed(6)}`;
    document.getElementById('cachedQueries').textContent = stats.total_cached_queries;
    document.getElementById('hitLatency').textContent = stats.avg_hit_latency_ms != null ? `${stats.avg_hit_latency_ms} ms` : '—';
    document.getElementById('missLatency').textContent = stats.avg_miss_latency_ms != null ? `${stats.avg_miss_latency_ms} ms` : '—';
    document.getElementById('threshold').textContent = stats.similarity_threshold;

    const hits = Math.round((stats.hit_rate_pct / 100) * stats.requests_in_window);
    const misses = stats.requests_in_window - hits;
    chart.data.datasets[0].data = [hits, misses];
    chart.update();

    const tbody = document.getElementById('feedBody');
    tbody.innerHTML = recent.map(r => `
      <tr>
        <td class="prompt-cell" title="${escapeHtml(r.prompt)}">${escapeHtml(r.prompt)}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
        <td>${r.similarity != null ? r.similarity : '—'}</td>
        <td>${r.latency_ms} ms</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('subtitle').textContent = 'backend not reachable — is main.py running on :8000?';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

initChart();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
